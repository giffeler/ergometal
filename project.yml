name: MetalErgoMiner
options:
  bundleIdPrefix: dev.ergometal
  deploymentTarget:
    macOS: "26.5"
  createIntermediateGroups: true
settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.5"
    CODE_SIGNING_ALLOWED: NO
targets:
  MetalErgoCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/MetalErgoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ergometal.core
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
  ergometal:
    type: tool
    platform: macOS
    sources:
      - path: Sources/ergometal
    dependencies:
      - target: MetalErgoCore
    settings:
      base:
        PRODUCT_NAME: ergometal
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @loader_path"
        OTHER_LDFLAGS: "$(inherited) -Wl,-sectcreate,__TEXT,__metallib,$(TARGET_BUILD_DIR)/default.metallib"
  MetalErgoCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MetalErgoCoreTests
      - path: Sources/MetalErgoCore/AutolykosKernels.metal
    dependencies:
      - target: MetalErgoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ergometal.tests
        GENERATE_INFOPLIST_FILE: YES
  ErgoMetalCLITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ErgoMetalCLITests
      - path: Sources/ergometal/Arguments.swift
      - path: Sources/ergometal/MiningCoordinator.swift
    dependencies:
      - target: MetalErgoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ergometal.cli-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MetalErgoMiner:
    build:
      targets:
        ergometal: all
        MetalErgoCoreTests: [test]
    test:
      targets:
        - MetalErgoCoreTests
        - ErgoMetalCLITests
    run:
      config: Debug
      executable: ergometal
